theme:
  name: dracula

# Advanced extensions compatible with the Dracula theme
markdown_extensions:
  - pymdownx.superfences:
      # This allows you to write interactive Mermaid.js diagrams 
      # inside standard code blocks using ```mermaid
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search                  # Keeps the default search bar active
  - table-reader            # Lets you pull raw CSV files directly into beautiful Markdown tables
  - git-revision-date-localized:
      type: timeago         # Automatically prints "Last updated 3 days ago" on every page
  - git-authors             # Automatically tracks who edited the file in Git

extra_css:
  - 'extra.css'